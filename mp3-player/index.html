<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>hello-wasm example</title>

    <button id="btn">play</button>
    <script type="module">
      import init, { run } from "./pkg/mp3_player.js";

        });
      });

  </body>
</html>
