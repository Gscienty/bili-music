[package]
name = "mp3-player"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.84"
console_error_panic_hook = { version = "0.1.7", optional = true }
tokio = { version = "1.43.0", features = ["sync", "rt"] }
async-trait = "0.1.86"
chrono = "0.4.39"
web-sys = { version = "0.3.77", features = [
  "Headers",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Window",
  "Document",
  "Element",
  "HtmlAnchorElement",
] }
wasm-bindgen-futures = "0.4.50"
tokio_with_wasm = { version = "0.8.2", features = [
  "rt",
  "rt-multi-thread",
  "sync",
] }
reqwest-wasm = { version = "0.11.16", features = ["stream", "wasm-streams"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
futures = "0.3.31"
futures-util = "0.3.31"
tokio-util = { version = "0.7.14", features = ["futures-io", "futures-util", "io", "io-util"] }
tokio-stream = "0.1.17"

[dev-dependencies]
wasm-bindgen-test = "0.3.34"


[profile.release]
opt-level = "s"
